<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataLens — AI Data Tutor</title>
  <meta name="description" content="DataLens is an AI-powered Data Tutor that helps you query and understand your data through natural conversation." />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          keyframes: {
            'fade-in-up': {
              '0%': { opacity: '0', transform: 'translateY(12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'pulse-dot': {
              '0%, 80%, 100%': { opacity: '0.3', transform: 'scale(0.8)' },
              '40%': { opacity: '1', transform: 'scale(1)' },
            },
            'glow': {
              '0%, 100%': { opacity: '0.4' },
              '50%': { opacity: '0.8' },
            },
          },
          animation: {
            'fade-in-up': 'fade-in-up 0.35s ease-out forwards',
            'pulse-dot-1': 'pulse-dot 1.4s ease-in-out infinite 0s',
            'pulse-dot-2': 'pulse-dot 1.4s ease-in-out infinite 0.2s',
            'pulse-dot-3': 'pulse-dot 1.4s ease-in-out infinite 0.4s',
            'glow': 'glow 2s ease-in-out infinite',
          },
        },
      },
    };
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- React 18 via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Mermaid.js -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      mermaid.initialize({ 
        startOnLoad: false, 
        theme: 'dark',
        xyChart: {
          width: 800,
          height: 450
        }
      });
    });
  </script>

  <style>
    /* Custom scrollbar */
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }
    .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 999px; }
    .chat-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

    /* Glassmorphism utility */
    .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  </style>
</head>

<body class="h-full bg-gradient-to-br from-gray-950 via-gray-900 to-indigo-950 font-sans antialiased">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    /* ─── Typing indicator ───────────────────────────────── */
    function TypingIndicator() {
      return (
        <div className="flex items-start gap-3 animate-fade-in-up">
          {/* Avatar */}
          <div className="flex-none w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 mt-0.5">
            <svg className="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <div className="glass rounded-2xl rounded-bl-sm border border-white/5 px-5 py-4 shadow-xl">
            <div className="flex items-center gap-2">
              <div className="flex gap-1.5">
                <span className="w-2 h-2 rounded-full bg-indigo-400 animate-pulse-dot-1"></span>
                <span className="w-2 h-2 rounded-full bg-indigo-400 animate-pulse-dot-2"></span>
                <span className="w-2 h-2 rounded-full bg-indigo-400 animate-pulse-dot-3"></span>
              </div>
              <span className="text-sm text-indigo-300/70 ml-1 font-medium">DataLens is thinking…</span>
            </div>
          </div>
        </div>
      );
    }

    /* ─── Single chat bubble ─────────────────────────────── */
    function ChatBubble({ role, text, onMaximize }) {
      const isUser = role === 'user';
      
      useEffect(() => {
        if (!isUser && text.includes('```mermaid')) {
          setTimeout(() => {
            try {
              mermaid.run();
            } catch (e) {
              console.error("Mermaid run error:", e);
            }
          }, 100); // Small delay to let React render the DOM first
        }
      }, [text, isUser]);

      const renderText = (content) => {
        if (isUser) return <p className="leading-relaxed whitespace-pre-wrap text-[15px]">{content}</p>;
        
        const parts = content.split(/```mermaid\n([\s\S]*?)```/g);
        return parts.map((part, idx) => {
          if (idx % 2 === 1) {
            return (
              <div key={idx} className="relative group my-4">
                <div 
                  className="mermaid bg-gray-900/80 p-4 rounded-xl border border-white/5 overflow-x-auto text-center flex justify-center shadow-inner cursor-zoom-in transition-colors hover:bg-gray-800/80"
                  onClick={(e) => onMaximize && onMaximize(e.currentTarget.innerHTML)}
                  title="Click to maximize chart"
                >
                  {part}
                </div>
                <button 
                  onClick={(e) => onMaximize && onMaximize(e.currentTarget.previousSibling.innerHTML)}
                  className="absolute top-2 right-2 p-1.5 bg-black/60 text-white rounded-lg opacity-0 group-hover:opacity-100 transition-opacity hover:bg-black/80 shadow-md"
                  title="Maximize Chart"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>
                </button>
              </div>
            );
          }
          return part ? <p key={idx} className="leading-relaxed whitespace-pre-wrap text-[15px]">{part}</p> : null;
        });
      };

      return (
        <div className={`flex w-full ${isUser ? 'justify-end' : 'items-start gap-3'} animate-fade-in-up`}>
          {/* AI avatar */}
          {!isUser && (
            <div className="flex-none w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 mt-0.5">
              <svg className="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
              </svg>
            </div>
          )}

          <div
            className={`max-w-[85%] md:max-w-[80%] rounded-2xl px-5 py-3.5 transition-all duration-300 ${
              isUser
                ? 'bg-gradient-to-br from-indigo-600 to-indigo-500 text-white rounded-br-sm shadow-lg shadow-indigo-600/20'
                : 'glass border border-white/5 text-gray-200 rounded-bl-sm shadow-xl'
            }`}
          >
            {renderText(text)}
          </div>
        </div>
      );
    }

    /* ─── Empty state ────────────────────────────────────── */
    function EmptyState() {
      return (
        <div className="h-[65vh] flex flex-col items-center justify-center animate-fade-in-up">
          <div className="relative mb-8">
            <div className="absolute inset-0 bg-indigo-500/20 rounded-3xl blur-2xl animate-glow"></div>
            <div className="relative w-20 h-20 rounded-3xl glass border border-white/10 flex items-center justify-center shadow-2xl">
              <svg className="w-10 h-10 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
              </svg>
            </div>
          </div>
          <h2 className="text-2xl font-bold text-gray-100 tracking-tight">Start a conversation</h2>
          <p className="text-gray-400 text-sm mt-3 text-center max-w-md leading-relaxed">
            Ask <span className="text-indigo-400 font-semibold">DataLens</span> anything about your data — get SQL explanations, insights, and smart follow-up questions.
          </p>
          <div className="flex flex-wrap justify-center gap-2 mt-8 max-w-lg">
            {['Show me all tables', 'Top 5 customers by revenue', 'Average order value by month'].map((q) => (
              <span key={q} className="text-xs px-3.5 py-2 rounded-full glass border border-white/5 text-gray-400 hover:text-indigo-300 hover:border-indigo-500/30 cursor-default transition-colors duration-200">
                {q}
              </span>
            ))}
          </div>
        </div>
      );
    }

    /* ─── Main App ───────────────────────────────────────── */
    function App() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [modalContent, setModalContent] = useState(null);
      const messagesEndRef = useRef(null);
      const inputRef = useRef(null);

      useEffect(() => {
        messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [messages, isLoading]);

      useEffect(() => {
        inputRef.current?.focus();
      }, []);

      const sendMessage = async (e) => {
        e.preventDefault();
        if (!input.trim() || isLoading) return;

        const userMessage = input.trim();
        setInput('');
        setMessages((prev) => [...prev, { role: 'user', text: userMessage }]);
        setIsLoading(true);

        try {
          const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_message: userMessage }),
          });

          if (!response.ok) throw new Error(`Server error: ${response.status}`);

          const data = await response.json();
          setMessages((prev) => [
            ...prev,
            { role: 'ai', text: data.reply || 'No response received.' },
          ]);
        } catch (error) {
          console.error('Failed to send message:', error);
          setMessages((prev) => [
            ...prev,
            { role: 'ai', text: '⚠️ Error: Could not reach DataLens. Make sure the backend is running on port 8000.' },
          ]);
        } finally {
          setIsLoading(false);
          inputRef.current?.focus();
        }
      };

      return (
        <div className="flex flex-col h-full text-gray-100 selection:bg-indigo-500/30 selection:text-white">
          {/* ─── Header ─────────────────────────────────── */}
          <header className="flex-none px-6 md:px-8 py-4 border-b border-white/5 glass shadow-xl z-10">
            <div className="max-w-4xl mx-auto flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 p-[1.5px] shadow-lg shadow-indigo-500/25">
                <div className="w-full h-full bg-gray-950 rounded-[10px] flex items-center justify-center">
                  <svg className="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
                  </svg>
                </div>
              </div>
              <div>
                <h1 className="text-xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-indigo-200 via-purple-200 to-indigo-300 tracking-tight leading-tight">
                  DataLens
                </h1>
                <p className="text-[11px] text-indigo-300/50 font-semibold tracking-widest uppercase">AI Data Tutor</p>
              </div>
            </div>
          </header>

          {/* ─── Chat Messages ──────────────────────────── */}
          <main className="flex-1 overflow-y-auto chat-scroll px-4 md:px-6 lg:px-8 py-6">
            <div className="max-w-4xl mx-auto space-y-5">
              {messages.length === 0 && <EmptyState />}

              {messages.map((msg, idx) => (
                <ChatBubble key={idx} role={msg.role} text={msg.text} onMaximize={setModalContent} />
              ))}

              {isLoading && <TypingIndicator />}

              <div ref={messagesEndRef} className="h-2" />
            </div>
          </main>

          {/* ─── Input Bar ──────────────────────────────── */}
          <footer className="flex-none px-4 md:px-6 pb-5 pt-3 bg-gradient-to-t from-gray-950 via-gray-950/95 to-transparent">
            <form onSubmit={sendMessage} className="max-w-4xl mx-auto relative group">
              {/* Glow effect */}
              <div className="absolute -inset-1 bg-gradient-to-r from-indigo-500/20 via-purple-500/20 to-indigo-500/20 rounded-2xl blur-lg opacity-0 group-focus-within:opacity-100 transition-opacity duration-500"></div>

              <div className="relative flex items-center bg-gray-900/80 backdrop-blur-xl border border-white/10 rounded-2xl overflow-hidden shadow-2xl focus-within:border-indigo-500/40 transition-all duration-300">
                <input
                  ref={inputRef}
                  id="chat-input"
                  type="text"
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  disabled={isLoading}
                  placeholder={isLoading ? 'DataLens is thinking…' : 'Ask your Data Tutor…'}
                  autoComplete="off"
                  className="w-full bg-transparent border-none py-4 pl-5 pr-14 text-gray-100 placeholder-gray-500 focus:outline-none disabled:opacity-50 text-[15px] transition-colors"
                />
                <button
                  id="send-button"
                  type="submit"
                  disabled={isLoading || !input.trim()}
                  className="absolute right-2.5 p-2.5 rounded-xl bg-indigo-500 hover:bg-indigo-400 text-white disabled:bg-white/5 disabled:text-white/20 disabled:cursor-not-allowed transition-all duration-200 hover:scale-105 active:scale-95 hover:shadow-lg hover:shadow-indigo-500/30"
                >
                  {isLoading ? (
                    <svg className="w-5 h-5 animate-spin text-indigo-300" fill="none" viewBox="0 0 24 24">
                      <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4" />
                      <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" />
                    </svg>
                  ) : (
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M12 19V5m-7 7l7-7 7 7" />
                    </svg>
                  )}
                </button>
              </div>
            </form>
          </footer>
          
          {/* ─── Chart Modal ────────────────────────────── */}
          {modalContent && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 md:p-8 animate-fade-in-up" style={{ animationDuration: '0.2s' }} onClick={() => setModalContent(null)}>
              <div 
                className="bg-gray-900 border border-white/10 rounded-2xl p-6 md:p-8 shadow-2xl w-full max-w-6xl max-h-full overflow-auto relative flex flex-col"
                onClick={e => e.stopPropagation()}
              >
                <button 
                  className="absolute top-4 right-4 p-2 text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 rounded-xl transition-colors"
                  onClick={() => setModalContent(null)}
                  title="Close (Esc)"
                >
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
                <h3 className="text-xl font-bold mb-4 text-gray-100">Expanded View</h3>
                <div 
                  className="w-full flex-1 flex items-center justify-center [&>svg]:!w-full [&>svg]:!h-auto [&>svg]:!max-w-full [&>svg]:max-h-[75vh]" 
                  dangerouslySetInnerHTML={{ __html: modalContent }} 
                />
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
