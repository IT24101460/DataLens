<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataLens — AI Data Tutor</title>
  <meta name="description" content="DataLens is an AI-powered Data Tutor that helps you query and understand your data through natural conversation." />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    window.tailwind = window.tailwind || {};
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          keyframes: {
            'fade-in-up': {
              '0%': { opacity: '0', transform: 'translateY(12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'pulse-dot': {
              '0%, 80%, 100%': { opacity: '0.3', transform: 'scale(0.8)' },
              '40%': { opacity: '1', transform: 'scale(1)' },
            },
            'glow': {
              '0%, 100%': { opacity: '0.4' },
              '50%': { opacity: '0.8' },
            },
          },
          animation: {
            'fade-in-up': 'fade-in-up 0.35s ease-out forwards',
            'pulse-dot-1': 'pulse-dot 1.4s ease-in-out infinite 0s',
            'pulse-dot-2': 'pulse-dot 1.4s ease-in-out infinite 0.2s',
            'pulse-dot-3': 'pulse-dot 1.4s ease-in-out infinite 0.4s',
            'glow': 'glow 2s ease-in-out infinite',
          },
        },
      },
    };
  </script>

  <!-- Prevent FOUC -->
  <script>
    if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- React 18 via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Mermaid.js -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      mermaid.initialize({ 
        startOnLoad: false, 
        theme: 'dark',
        xyChart: {
          width: 800,
          height: 450
        }
      });
    });
  </script>

  <style>
    /* Custom scrollbar */
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }
    .chat-scroll::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); }\n    .dark .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 999px; }
    .chat-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

    /* Glassmorphism utility */
    .glass { background: rgba(255,255,255,0.7); }\n    .dark .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  </style>
</head>

<body class="h-full min-h-screen bg-slate-950 text-slate-100 font-sans antialiased">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    /* ─── Theme Toggle Component ───────────────────────────── */
    function ThemeToggle() {
      const [theme, setTheme] = useState(localStorage.theme || 'system');

      useEffect(() => {
        if (theme === 'system') {
          localStorage.removeItem('theme');
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } else {
          localStorage.theme = theme;
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        }
      }, [theme]);

      return (
        <div className="relative group z-50">
          <button className="w-10 h-10 rounded-full flex items-center justify-center bg-white/50 dark:bg-white/5 hover:bg-white/80 dark:hover:bg-white/10 transition-colors border border-gray-200 dark:border-white/10 shadow-sm text-gray-700 dark:text-gray-300">
            {theme === 'light' && (
              <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
            )}
            {theme === 'dark' && (
              <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
            )}
            {theme === 'system' && (
              <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
            )}
          </button>
          
          <div className="absolute right-0 mt-2 w-36 bg-white dark:bg-[#1a1d24] rounded-xl shadow-xl border border-gray-100 dark:border-white/5 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 overflow-hidden z-50 transform origin-top-right scale-95 group-hover:scale-100">
            <button onClick={() => setTheme('light')} className={`w-full text-left px-4 py-2.5 text-sm flex items-center gap-2 hover:bg-gray-50 dark:hover:bg-white/5 ${theme==='light' ? 'text-indigo-600 dark:text-indigo-400 font-medium' : 'text-gray-700 dark:text-gray-300'}`}>
              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
              Light
            </button>
            <button onClick={() => setTheme('dark')} className={`w-full text-left px-4 py-2.5 text-sm flex items-center gap-2 hover:bg-gray-50 dark:hover:bg-white/5 ${theme==='dark' ? 'text-indigo-600 dark:text-indigo-400 font-medium' : 'text-gray-700 dark:text-gray-300'}`}>
              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" /></svg>
              Dark
            </button>
            <button onClick={() => setTheme('system')} className={`w-full text-left px-4 py-2.5 text-sm flex items-center gap-2 hover:bg-gray-50 dark:hover:bg-white/5 ${theme==='system' ? 'text-indigo-600 dark:text-indigo-400 font-medium' : 'text-gray-700 dark:text-gray-300'}`}>
              <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
              System
            </button>
          </div>
        </div>
      );
    }

    /* ─── Typing indicator ───────────────────────────────── */
    function TypingIndicator() {
      return (
        <div className="flex items-start gap-3 animate-fade-in-up">
          {/* Avatar */}
          <div className="flex-none w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 mt-0.5">
            <svg className="w-4 h-4 text-gray-900 dark:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <div className="glass rounded-2xl rounded-bl-sm border border-gray-200 dark:border-white/5 px-5 py-4 shadow-xl">
            <div className="flex items-center gap-2">
              <div className="flex gap-1.5">
                <span className="w-2 h-2 rounded-full bg-indigo-400 animate-pulse-dot-1"></span>
                <span className="w-2 h-2 rounded-full bg-indigo-400 animate-pulse-dot-2"></span>
                <span className="w-2 h-2 rounded-full bg-indigo-400 animate-pulse-dot-3"></span>
              </div>
              <span className="text-sm text-indigo-300/70 ml-1 font-medium">DataLens is thinking…</span>
            </div>
          </div>
        </div>
      );
    }

    /* ─── Single chat bubble ─────────────────────────────── */
    function ChatBubble({ role, text, onMaximize }) {
      const isUser = role === 'user';
      
      useEffect(() => {
        if (!isUser && text.includes('```mermaid')) {
          setTimeout(() => {
            try {
              mermaid.run();
            } catch (e) {
              console.error("Mermaid run error:", e);
            }
          }, 100); // Small delay to let React render the DOM first
        }
      }, [text, isUser]);

      const renderText = (content) => {
        if (isUser) return <p className="leading-relaxed whitespace-pre-wrap text-[15px]">{content}</p>;
        
        const parts = content.split(/```mermaid\n([\s\S]*?)```/g);
        return parts.map((part, idx) => {
          if (idx % 2 === 1) {
            return (
              <div key={idx} className="relative group my-4">
                <div 
                  className="mermaid bg-gray-900/80 p-4 rounded-xl border border-gray-200 dark:border-white/5 overflow-x-auto text-center flex justify-center shadow-inner cursor-zoom-in transition-colors hover:bg-gray-800/80"
                  onClick={(e) => onMaximize && onMaximize(e.currentTarget.innerHTML)}
                  title="Click to maximize chart"
                >
                  {part}
                </div>
                <button 
                  onClick={(e) => onMaximize && onMaximize(e.currentTarget.previousSibling.innerHTML)}
                  className="absolute top-2 right-2 p-1.5 bg-black/60 text-gray-900 dark:text-white rounded-lg opacity-0 group-hover:opacity-100 transition-opacity hover:bg-black/80 shadow-md"
                  title="Maximize Chart"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>
                </button>
              </div>
            );
          }
          return part ? <p key={idx} className="leading-relaxed whitespace-pre-wrap text-[15px]">{part}</p> : null;
        });
      };

      return (
        <div className={`flex w-full ${isUser ? 'justify-end' : 'items-start gap-3'} animate-fade-in-up`}>
          {/* AI avatar */}
          {!isUser && (
            <div className="flex-none w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 mt-0.5">
              <svg className="w-4 h-4 text-gray-900 dark:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
              </svg>
            </div>
          )}

          <div
            className={`max-w-[85%] md:max-w-[80%] rounded-2xl px-5 py-3.5 transition-all duration-300 ${
              isUser
                ? 'bg-gradient-to-br from-indigo-600 to-indigo-500 text-gray-900 dark:text-white rounded-br-sm shadow-lg shadow-indigo-600/20'
                : 'glass border border-gray-200 dark:border-white/5 text-gray-800 dark:text-gray-200 rounded-bl-sm shadow-xl'
            }`}
          >
            {renderText(text)}
          </div>
        </div>
      );
    }

    /* ─── Dashboard Components ───────────────────────────── */
    function StatCard({ title, value, icon, trend, positive }) {
      return (
        <div className="glass rounded-2xl p-6 border border-gray-200 dark:border-white/5 shadow-xl hover:bg-white/[0.02] transition-colors relative overflow-hidden group">
          <div className="absolute top-0 right-0 p-8 opacity-5 group-hover:scale-110 transition-transform duration-500 pointer-events-none">
            {icon}
          </div>
          <p className="text-gray-600 dark:text-gray-400 text-sm font-medium mb-1">{title}</p>
          <h3 className="text-3xl font-bold text-gray-100">{value}</h3>
          {trend && (
            <p className={`mt-3 text-xs font-semibold flex items-center gap-1 ${positive ? 'text-emerald-400' : 'text-rose-400'}`}>
              <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                {positive ? (
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                ) : (
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />
                )}
              </svg>
              {trend}
            </p>
          )}
        </div>
      );
    }

    /* ─── Expandable Chat Widget ─────────────────────────── */
    function ChatWidget({ onMaximize, autoQuery, setAutoQuery }) {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [isOpen, setIsOpen] = useState(false);
      const messagesEndRef = useRef(null);
      const inputRef = useRef(null);

      useEffect(() => {
        if (isOpen) {
          messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
          setTimeout(() => inputRef.current?.focus(), 100);
        }
      }, [messages, isLoading, isOpen]);

      useEffect(() => {
        if (autoQuery) {
          setInput(autoQuery);
          setIsOpen(true);
          if (setAutoQuery) setAutoQuery('');
        }
      }, [autoQuery, setAutoQuery]);

      const sendMessage = async (e) => {
        e.preventDefault();
        if (!input.trim() || isLoading) return;

        const userMessage = input.trim();
        setInput('');
        setMessages((prev) => [...prev, { role: 'user', text: userMessage }]);
        setIsLoading(true);

        try {
          const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_message: userMessage }),
          });

          if (!response.ok) throw new Error(`Server error: ${response.status}`);

          const data = await response.json();
          setMessages((prev) => [
            ...prev,
            { role: 'ai', text: data.reply || 'No response received.' },
          ]);
        } catch (error) {
          console.error('Failed to send message:', error);
          setMessages((prev) => [
            ...prev,
            { role: 'ai', text: '⚠️ Error: Could not reach DataLens.' },
          ]);
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="fixed bottom-6 right-6 z-40 flex flex-col items-end">
          {/* Chat Window */}
          {isOpen && (
            <div className="w-full sm:w-[450px] h-[650px] max-h-[85vh] mb-4 bg-gray-950/95 backdrop-blur-2xl rounded-3xl border border-gray-200 dark:border-white/10 shadow-[0_0_50px_rgba(79,70,229,0.15)] flex flex-col overflow-hidden animate-fade-in-up origin-bottom-right">
              {/* Header */}
              <div className="flex-none px-5 py-4 border-b border-gray-200 dark:border-white/5 bg-gray-900/50 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <svg className="w-4 h-4 text-gray-900 dark:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                  </div>
                  <div>
                    <h2 className="text-sm font-bold text-gray-100">DataLens Tutor</h2>
                    <p className="text-[10px] text-indigo-300/70 font-semibold uppercase tracking-wider">AI Assistant</p>
                  </div>
                </div>
                <button onClick={() => setIsOpen(false)} className="text-gray-600 dark:text-gray-400 hover:text-white p-2 rounded-lg hover:bg-white/5 transition-colors">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
              </div>

              {/* Messages */}
              <div className="flex-1 overflow-y-auto chat-scroll px-4 py-5 bg-gradient-to-b from-transparent to-gray-900/20">
                <div className="space-y-4">
                  {messages.length === 0 && (
                    <div className="text-center mt-8 text-gray-600 dark:text-gray-400 text-sm">
                      <p className="mb-2 text-gray-700 dark:text-gray-300">Hello! I'm DataLens.</p>
                      <p>Ask me anything about your HR data.</p>
                    </div>
                  )}
                  {messages.map((msg, idx) => (
                    <ChatBubble key={idx} role={msg.role} text={msg.text} onMaximize={onMaximize} />
                  ))}
                  {isLoading && <TypingIndicator />}
                  <div ref={messagesEndRef} className="h-2" />
                </div>
              </div>

              {/* Input */}
              <form onSubmit={sendMessage} className="flex-none p-3 bg-gray-900/50 border-t border-gray-200 dark:border-white/5">
                <div className="relative flex items-center bg-gray-950/50 rounded-xl overflow-hidden border border-gray-200 dark:border-white/5 focus-within:border-indigo-500/30 transition-colors">
                  <input
                    ref={inputRef}
                    type="text"
                    value={input}
                    onChange={(e) => setInput(e.target.value)}
                    disabled={isLoading}
                    placeholder="Ask about HR data..."
                    className="w-full bg-transparent border-none py-3 pl-4 pr-12 text-sm text-gray-100 placeholder-gray-500 focus:outline-none"
                  />
                  <button
                    type="submit"
                    disabled={isLoading || !input.trim()}
                    className="absolute right-1.5 p-1.5 rounded-lg bg-indigo-500 hover:bg-indigo-400 text-gray-900 dark:text-white disabled:opacity-50 transition-colors"
                  >
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M12 19V5m-7 7l7-7 7 7" /></svg>
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* FAB Button */}
          <button
            onClick={() => setIsOpen(!isOpen)}
            className={`relative flex items-center justify-center w-14 h-14 rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 text-gray-900 dark:text-white shadow-xl shadow-indigo-600/30 hover:scale-105 active:scale-95 transition-all duration-300 z-50 ${isOpen ? 'rotate-90 scale-90 opacity-0 pointer-events-none absolute' : 'rotate-0 opacity-100'}`}
          >
            <div className="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full blur-sm opacity-50 animate-glow"></div>
            <svg className="w-6 h-6 relative z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" /></svg>
          </button>
        </div>
      );
    }

    /* ─── Chart Builder ──────────────────────────────────────── */
    function ChartBuilder({ schema, activeTable }) {
      const [selectedX, setSelectedX] = useState('');
      const [selectedY, setSelectedY] = useState('');
      const [aggregation, setAggregation] = useState('Count');
      
      const [chartType, setChartType] = useState('Auto');
      const [colorTheme, setColorTheme] = useState('Default');
      const [isGenerating, setIsGenerating] = useState(false);
      const [chartContent, setChartContent] = useState(null);
      const [error, setError] = useState(null);

      React.useEffect(() => {
        if (activeTable && schema && schema[activeTable]) {
          setSelectedX(schema[activeTable][0] || '');
          setSelectedY(schema[activeTable][1] || schema[activeTable][0] || '');
        }
      }, [activeTable, schema]);

      const handleGenerate = async (e) => {
        e.preventDefault();
        if (!activeTable || isGenerating) return;
        
        setIsGenerating(true);
        setError(null);
        
        let prompt = `Query the \`${activeTable}\` table. Group the data by \`${selectedX}\` for the x-axis categories.`;
        if (aggregation === 'Count') {
           prompt += ` Calculate the count of rows for the y-axis values.`;
        } else if (aggregation === 'None') {
           prompt += ` Use \`${selectedY}\` for the y-axis values without aggregation.`;
        } else {
           prompt += ` Calculate the ${aggregation} of \`${selectedY}\` for the y-axis values.`;
        }
        
        if (chartType !== 'Auto') {
          prompt += ` You MUST use a ${chartType}.`;
        }
        prompt += ' CRITICAL: You MUST LIMIT your output to a maximum of 15 data points. If the x-axis represents dates or times, DO NOT just return the top 15 dates. You MUST aggregate and group the data temporally (e.g., by month or year) and order it chronologically so it represents the full timeline within the 15 data point limit! Do NOT output more than 15 items in the x-axis or y-axis arrays, otherwise the chart will crash! Do not include a theme init block or multiple colors in your prompt, I will handle colors. Just return the valid markdown code block.';

        try {
          const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_message: prompt }),
          });

          if (!response.ok) throw new Error(`Server error: ${response.status}`);
          
          const data = await response.json();
          let aiResponse = data.reply || '';
          
          // Extract mermaid block
          const mermaidMatch = aiResponse.match(/```mermaid\n([\s\S]*?)```/);
          if (mermaidMatch) {
            let chartCode = mermaidMatch[1];
            
            // Inject color theme if not Default
            if (colorTheme !== 'Default') {
               const colorMap = {
                 'Indigo': '#6366f1',
                 'Emerald': '#10b981',
                 'Rose': '#f43f5e',
                 'Amber': '#f59e0b'
               };
               const hex = colorMap[colorTheme];
               const isPie = chartCode.trim().startsWith('pie');
               
               if (isPie) {
                 chartCode = `%%{init: {'themeVariables': { 'pie1': '${hex}', 'pie2': '${hex}80', 'pie3': '${hex}40', 'pie4': '${hex}aa', 'pie5': '${hex}60', 'pieStrokeColor': 'rgba(255,255,255,0.1)' }}}%%\n` + chartCode;
               } else {
                 chartCode = `%%{init: {'themeVariables': { 'xyChart': { 'plotColorPalette': '${hex}' }}}}%%\n` + chartCode;
               }
            }

        const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });

        const a = document.createElement('a');

    function IngestionHub({ onComplete, onClose }) {
      const [validating, setValidating] = useState(null); 
      const [dbUrl, setDbUrl] = useState('');
      const [error, setError] = useState(null);
      const fileInputRef = useRef(null);

      const handleConnectDB = async () => {
        if (!dbUrl) return;
        setValidating('db');
        setError(null);
        try {
          const res = await fetch('/api/connect', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ db_url: dbUrl })
          });
          const data = await res.json();
          if (res.ok) {
            onComplete();
          } else {
            setError(data.detail || 'Connection failed');
            setValidating(null);
          }
        } catch (err) {
          setError(err.message);
          setValidating(null);
        }
      };

      const handleFileUpload = async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        setValidating('file');
        setError(null);
        
        const formData = new FormData();
        formData.append('file', file);
        
        try {
          const res = await fetch('/api/upload', {
            method: 'POST',
            body: formData
          });
          const data = await res.json();
          if (res.ok) {
            onComplete();
          } else {
            setError(data.detail || 'Upload failed');
            setValidating(null);
          }
        } catch (err) {
          setError(err.message);
          setValidating(null);
        }
      };

        setValidating('sheets');
        setTimeout(() => {
          onComplete(); // Still simulated

      const [chatAutoQuery, setChatAutoQuery] = useState('');

      const fetchSchema = React.useCallback(() => {
        setIsLoadingSchema(true);
        fetch('/api/schema')
          .then(res => res.json())
          .then(data => {
            setSchema(data);
            const tables = Object.keys(data);
            if (tables.length > 0) {
              if (!activeTable || !tables.includes(activeTable)) {
                setActiveTable(tables[0]);
              }
            } else {
              setActiveTable('');
            }
          })
          .catch(err => console.error('Failed to load schema:', err))
          .finally(() => setIsLoadingSchema(false));
      }, [activeTable]);

      const fetchInsights = React.useCallback((table = activeTable) => {
        if (currentScreen !== 'dashboard') return;
        setIsLoadingStats(true);
        const url = table ? `/api/insights?table=${table}` : '/api/insights';
        fetch(url)
          .then(res => res.json())
          .then(data => {
            if (data.stats) {
              setDashboardStats(data.stats);
            }
          })
          .catch(err => console.error("Error fetching insights:", err))
          .finally(() => setIsLoadingStats(false));
      }, [activeTable, currentScreen]);

      const fetchAnalysis = React.useCallback((table) => {
        if (!table) return;
        setIsAnalyzing(true);
        setDatasetAnalysis(null);
        fetch('/api/analyze-dataset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ table_name: table })
        })
        .then(res => res.json())
        .then(data => {
          if (data) {
            setDatasetAnalysis(data);
          }
        })
        .catch(err => console.error("Error fetching analysis:", err))
        .finally(() => setIsAnalyzing(false));
      }, []);

      React.useEffect(() => {
        if (currentScreen === 'dashboard') {
          fetchSchema();
        }
      }, [currentScreen]); // intentionally without fetchSchema in deps to run once

      React.useEffect(() => {
        if (currentScreen === 'dashboard' && activeTable) {
          fetchInsights(activeTable);
          fetchAnalysis(activeTable);
        }
      }, [activeTable, currentScreen, fetchInsights, fetchAnalysis]);

      if (currentScreen === 'login') {
        return (
          <div className="flex flex-col min-h-screen">
            <LoginScreen onLogin={() => setCurrentScreen('dashboard')} />
            <Footer />
          </div>
        );
      }
      
      if (currentScreen === 'docs') {
        return <DocumentationScreen onNavigateBack={() => setCurrentScreen('dashboard')} />;
      }

      // Dummy HR Data Icons
      const icons = {
        users: <svg className="w-full h-full text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>,
        briefcase: <svg className="w-full h-full text-purple-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
        trending: <svg className="w-full h-full text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>,
        cash: <svg className="w-full h-full text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
      };

      return (
        <div className="flex flex-col h-full text-slate-100 selection:bg-indigo-500/30 selection:text-white relative">
          
          {/* Header */}
          <header className="flex-none px-6 md:px-10 py-5 border-b border-gray-200 dark:border-white/5 bg-gray-950/80 backdrop-blur-xl sticky top-0 z-20 shadow-xl">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-4">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg">
                  <svg className="w-6 h-6 text-gray-900 dark:text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012-2h-2a2 2 0 01-2-2z" /></svg>
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-slate-100">HR Analytics Dashboard</h1>
                  <div className="flex items-center gap-2 mt-0.5">
                    <p className="text-xs text-slate-400 font-medium">Active Dataset:</p>
                    <select 
                      value={activeTable}
                      onChange={e => setActiveTable(e.target.value)}
                      disabled={isLoadingSchema || Object.keys(schema).length === 0}
                      className="bg-slate-900 border border-slate-700 text-slate-100 px-3 py-1.5 rounded-lg text-sm focus:ring-1 focus:ring-indigo-500 cursor-pointer disabled:opacity-50 focus:outline-none transition-all"
                    >
                      {isLoadingSchema ? (
                        <option>Loading...</option>
                      ) : Object.keys(schema).length === 0 ? (
                        <option>No Datasets</option>
                      ) : (
                        Object.keys(schema).map(table => (
                          <option key={table} value={table}>{table}</option>
                        ))
                      )}
                    </select>
                  </div>
                </div>
              </div>
              <div className="hidden sm:flex items-center gap-4">
                <ThemeToggle />
                <button 
                  onClick={() => setCurrentScreen('docs')}
                  className="text-xs font-bold px-3 py-1.5 text-indigo-600 dark:text-indigo-300 hover:text-indigo-200 transition-colors flex items-center gap-1.5 hover:bg-white/5 rounded-lg"
                >
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                  Docs
                </button>
                <button 
                  onClick={() => setShowDataModal(true)}
                  className="text-xs font-bold px-3 py-1.5 bg-indigo-100 dark:bg-indigo-500/20 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-500 hover:text-white rounded-lg transition-colors border border-indigo-200 dark:border-indigo-500/30 flex items-center gap-1"
                >
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>
                  Connect Data
                </button>
                <div className="text-right">
                  <p className="text-sm font-semibold text-slate-200">Jane Doe</p>
                  <p className="text-xs text-slate-400">CHRO</p>
                </div>
                <div className="w-10 h-10 rounded-full bg-indigo-900 border-2 border-indigo-200 dark:border-indigo-500/30"></div>
              </div>
            </div>
          </header>

          {/* Main Dashboard Content */}
          <main className="flex-1 overflow-y-auto px-6 md:px-10 py-8">
            <div className="max-w-7xl mx-auto space-y-8 pb-24">
              
              {(!activeTable && !isLoadingSchema) ? (
                <div className="flex flex-col items-center justify-center py-16 md:py-32 animate-fade-in-up text-center">
                  <div className="w-24 h-24 rounded-full bg-gradient-to-tr from-indigo-500/20 to-purple-600/20 flex items-center justify-center mb-8 border border-indigo-200 dark:border-indigo-500/30 shadow-[0_0_60px_rgba(79,70,229,0.3)] relative">
                     <div className="absolute inset-0 rounded-full animate-ping bg-indigo-50 dark:bg-indigo-500/10"></div>
                     <svg className="w-12 h-12 text-indigo-600 dark:text-indigo-400 relative z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                  </div>
                  
                  <h2 className="text-4xl md:text-5xl font-bold text-gray-900 dark:text-white mb-6 tracking-tight">
                    Welcome to <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-purple-400">DataLens</span>
                  </h2>
                  <p className="text-gray-600 dark:text-gray-400 max-w-xl text-lg mb-10 leading-relaxed">
                    Your AI-powered executive analytics platform. Connect a database or upload a file to instantly generate intelligent insights, health scores, and dynamic charts.
                  </p>
                  
                  <div className="flex flex-col sm:flex-row gap-5">
                    <button 
                      onClick={() => setShowDataModal(true)}
                      className="px-8 py-4 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-2xl font-bold text-gray-900 dark:text-white shadow-lg shadow-indigo-500/25 hover:shadow-indigo-500/40 hover:-translate-y-1 transition-all flex items-center justify-center gap-3 text-lg"
                    >
                      <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" /></svg>
                      Connect Your Data
                    </button>
                    
                    <button 
                      onClick={() => setCurrentScreen('docs')}
                      className="px-8 py-4 glass rounded-2xl font-bold text-gray-700 dark:text-gray-300 border border-gray-200 dark:border-white/10 hover:bg-white/5 transition-all flex items-center justify-center gap-3 text-lg hover:-translate-y-1 hover:border-indigo-500/50 group"
                    >
                      <svg className="w-6 h-6 text-indigo-600 dark:text-indigo-400 group-hover:text-indigo-300 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" /></svg>
                      Read Documentation
                    </button>
                  </div>
                </div>
              ) : (
                <>
                  {/* Executive Banner */}
                  <ExecutiveIntelligenceBanner 
                    analysis={datasetAnalysis} 
                    onQueryClick={setChatAutoQuery} 
                  />

                  {/* Stat Cards Grid */}
                  <div className="mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                    <div>
                      <h2 className="text-xl font-bold text-gray-100">Top Indicators</h2>
                      <p className="text-xs text-gray-600 dark:text-gray-400 mt-1">AI-generated metrics {activeTable ? `for ${activeTable}` : ''}</p>
                    </div>
                    <button 
                      onClick={() => fetchInsights(activeTable)} 
                      disabled={isLoadingStats} 
                      className="text-xs font-semibold px-4 py-2 bg-indigo-500 hover:bg-indigo-400 rounded-lg text-gray-900 dark:text-white transition-colors flex items-center gap-2 disabled:opacity-50"
                    >
                      <svg className={`w-4 h-4 ${isLoadingStats ? 'animate-spin' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                      {isLoadingStats ? 'Analyzing...' : 'Refresh Indicators'}
                    </button>
                  </div>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                    {isLoadingStats ? (
                      Array(4).fill(0).map((_, i) => (
                        <div key={i} className="glass rounded-2xl p-6 border border-gray-200 dark:border-white/5 shadow-xl animate-pulse h-32 flex flex-col justify-between">
                          <div className="h-4 bg-white/10 rounded w-1/2"></div>
                          <div className="h-8 bg-white/10 rounded w-3/4"></div>
                          <div className="h-3 bg-white/10 rounded w-1/3"></div>
                        </div>
                      ))
                    ) : dashboardStats.length > 0 ? (
                      dashboardStats.map((stat, i) => (
                        <StatCard 
                          key={i} 
                          title={stat.title} 
                          value={stat.value} 
                          icon={icons[stat.icon] || icons.trending} 
                          trend={stat.trend} 
                          positive={stat.positive} 
                        />
                      ))
                    ) : (
                      <>
                        <StatCard title="Total Records" value="--" icon={icons.users} trend="Waiting for data" positive={true} />
                        <StatCard title="Key Metric 1" value="--" icon={icons.briefcase} trend="Waiting for data" positive={false} />
                        <StatCard title="Key Metric 2" value="--" icon={icons.trending} trend="Waiting for data" positive={true} />
                        <StatCard title="Key Metric 3" value="--" icon={icons.cash} trend="Waiting for data" positive={true} />
                      </>
                    )}
                  </div>

                  {/* Charts Area */}
                  <ChartBuilder schema={schema} activeTable={activeTable} />
                </>
              )}
            </div>
            <Footer />
          </main>

          {/* Floating Chat Widget */}
          <ChatWidget 
            onMaximize={setModalContent} 
            autoQuery={chatAutoQuery}
            setAutoQuery={setChatAutoQuery}
          />
          {/* ─── Chart Modal ────────────────────────────── */}
          {modalContent && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 md:p-8 animate-fade-in-up" style={{ animationDuration: '0.2s' }} onClick={() => setModalContent(null)}>
              <div 
                className="bg-white dark:bg-gray-900 border border-gray-200 dark:border-white/10 rounded-2xl p-6 md:p-8 shadow-2xl w-full max-w-6xl max-h-full overflow-auto relative flex flex-col"
                onClick={e => e.stopPropagation()}
              >
                <button 
                  className="absolute top-4 right-4 p-2 text-gray-600 dark:text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 rounded-xl transition-colors"
                  onClick={() => setModalContent(null)}
                  title="Close (Esc)"
                >
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
                <h3 className="text-xl font-bold mb-4 text-gray-100">Expanded View</h3>
                <div 
                  className="w-full flex-1 flex items-center justify-center [&>svg]:!w-full [&>svg]:!h-auto [&>svg]:!max-w-full [&>svg]:max-h-[75vh]" 
                  dangerouslySetInnerHTML={{ __html: modalContent }} 
                />
              </div>
            </div>
          )}

          {/* ─── Data Connect Modal ───────────────────────── */}
          {showDataModal && (
            <div className="fixed inset-0 z-[200] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 md:p-8 animate-fade-in-up" style={{ animationDuration: '0.2s' }}>
              <div className="bg-gray-50 dark:bg-gray-950 border border-gray-200 dark:border-white/10 rounded-2xl shadow-2xl w-full max-w-6xl max-h-full overflow-y-auto relative flex flex-col">
                <IngestionHub 
                  onClose={() => setShowDataModal(false)}
                  onComplete={() => {
                    setShowDataModal(false);
                    fetchSchema();
                  }} 
                />
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
