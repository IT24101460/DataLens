<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DataLens — AI Data Tutor</title>
  <meta name="description" content="DataLens is an AI-powered Data Tutor that helps you query and understand your data through natural conversation." />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwindcss.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          keyframes: {
            'fade-in-up': {
              '0%': { opacity: '0', transform: 'translateY(12px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            'pulse-dot': {
              '0%, 80%, 100%': { opacity: '0.3', transform: 'scale(0.8)' },
              '40%': { opacity: '1', transform: 'scale(1)' },
            },
            'glow': {
              '0%, 100%': { opacity: '0.4' },
              '50%': { opacity: '0.8' },
            },
          },
          animation: {
            'fade-in-up': 'fade-in-up 0.35s ease-out forwards',
            'pulse-dot-1': 'pulse-dot 1.4s ease-in-out infinite 0s',
            'pulse-dot-2': 'pulse-dot 1.4s ease-in-out infinite 0.2s',
            'pulse-dot-3': 'pulse-dot 1.4s ease-in-out infinite 0.4s',
            'glow': 'glow 2s ease-in-out infinite',
          },
        },
      },
    };
  </script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- React 18 via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel for JSX -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Mermaid.js -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      mermaid.initialize({ 
        startOnLoad: false, 
        theme: 'dark',
        xyChart: {
          width: 800,
          height: 450
        }
      });
    });
  </script>

  <style>
    /* Custom scrollbar */
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }
    .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 999px; }
    .chat-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

    /* Glassmorphism utility */
    .glass { background: rgba(255,255,255,0.03); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  </style>
</head>

<body class="h-full bg-gradient-to-br from-gray-950 via-gray-900 to-indigo-950 font-sans antialiased">
  <div id="root" class="h-full"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    /* ─── Typing indicator ───────────────────────────────── */
    function TypingIndicator() {
      return (
        <div className="flex items-start gap-3 animate-fade-in-up">
          {/* Avatar */}
          <div className="flex-none w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 mt-0.5">
            <svg className="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
            </svg>
          </div>
          <div className="glass rounded-2xl rounded-bl-sm border border-white/5 px-5 py-4 shadow-xl">
            <div className="flex items-center gap-2">
              <div className="flex gap-1.5">
                <span className="w-2 h-2 rounded-full bg-indigo-400 animate-pulse-dot-1"></span>
                <span className="w-2 h-2 rounded-full bg-indigo-400 animate-pulse-dot-2"></span>
                <span className="w-2 h-2 rounded-full bg-indigo-400 animate-pulse-dot-3"></span>
              </div>
              <span className="text-sm text-indigo-300/70 ml-1 font-medium">DataLens is thinking…</span>
            </div>
          </div>
        </div>
      );
    }

    /* ─── Single chat bubble ─────────────────────────────── */
    function ChatBubble({ role, text, onMaximize }) {
      const isUser = role === 'user';
      
      useEffect(() => {
        if (!isUser && text.includes('```mermaid')) {
          setTimeout(() => {
            try {
              mermaid.run();
            } catch (e) {
              console.error("Mermaid run error:", e);
            }
          }, 100); // Small delay to let React render the DOM first
        }
      }, [text, isUser]);

      const renderText = (content) => {
        if (isUser) return <p className="leading-relaxed whitespace-pre-wrap text-[15px]">{content}</p>;
        
        const parts = content.split(/```mermaid\n([\s\S]*?)```/g);
        return parts.map((part, idx) => {
          if (idx % 2 === 1) {
            return (
              <div key={idx} className="relative group my-4">
                <div 
                  className="mermaid bg-gray-900/80 p-4 rounded-xl border border-white/5 overflow-x-auto text-center flex justify-center shadow-inner cursor-zoom-in transition-colors hover:bg-gray-800/80"
                  onClick={(e) => onMaximize && onMaximize(e.currentTarget.innerHTML)}
                  title="Click to maximize chart"
                >
                  {part}
                </div>
                <button 
                  onClick={(e) => onMaximize && onMaximize(e.currentTarget.previousSibling.innerHTML)}
                  className="absolute top-2 right-2 p-1.5 bg-black/60 text-white rounded-lg opacity-0 group-hover:opacity-100 transition-opacity hover:bg-black/80 shadow-md"
                  title="Maximize Chart"
                >
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>
                </button>
              </div>
            );
          }
          return part ? <p key={idx} className="leading-relaxed whitespace-pre-wrap text-[15px]">{part}</p> : null;
        });
      };

      return (
        <div className={`flex w-full ${isUser ? 'justify-end' : 'items-start gap-3'} animate-fade-in-up`}>
          {/* AI avatar */}
          {!isUser && (
            <div className="flex-none w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 mt-0.5">
              <svg className="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
              </svg>
            </div>
          )}

          <div
            className={`max-w-[85%] md:max-w-[80%] rounded-2xl px-5 py-3.5 transition-all duration-300 ${
              isUser
                ? 'bg-gradient-to-br from-indigo-600 to-indigo-500 text-white rounded-br-sm shadow-lg shadow-indigo-600/20'
                : 'glass border border-white/5 text-gray-200 rounded-bl-sm shadow-xl'
            }`}
          >
            {renderText(text)}
          </div>
        </div>
      );
    }

    /* ─── Dashboard Components ───────────────────────────── */
    function StatCard({ title, value, icon, trend, positive }) {
      return (
        <div className="glass rounded-2xl p-6 border border-white/5 shadow-xl hover:bg-white/[0.02] transition-colors relative overflow-hidden group">
          <div className="absolute top-0 right-0 p-8 opacity-5 group-hover:scale-110 transition-transform duration-500 pointer-events-none">
            {icon}
          </div>
          <p className="text-gray-400 text-sm font-medium mb-1">{title}</p>
          <h3 className="text-3xl font-bold text-gray-100">{value}</h3>
          {trend && (
            <p className={`mt-3 text-xs font-semibold flex items-center gap-1 ${positive ? 'text-emerald-400' : 'text-rose-400'}`}>
              <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                {positive ? (
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" />
                ) : (
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M13 17h8m0 0V9m0 8l-8-8-4 4-6-6" />
                )}
              </svg>
              {trend}
            </p>
          )}
        </div>
      );
    }

    /* ─── Expandable Chat Widget ─────────────────────────── */
    function ChatWidget({ onMaximize }) {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [isOpen, setIsOpen] = useState(false);
      const messagesEndRef = useRef(null);
      const inputRef = useRef(null);

      useEffect(() => {
        if (isOpen) {
          messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
          setTimeout(() => inputRef.current?.focus(), 100);
        }
      }, [messages, isLoading, isOpen]);

      const sendMessage = async (e) => {
        e.preventDefault();
        if (!input.trim() || isLoading) return;

        const userMessage = input.trim();
        setInput('');
        setMessages((prev) => [...prev, { role: 'user', text: userMessage }]);
        setIsLoading(true);

        try {
          const response = await fetch('/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ user_message: userMessage }),
          });

          if (!response.ok) throw new Error(`Server error: ${response.status}`);

          const data = await response.json();
          setMessages((prev) => [
            ...prev,
            { role: 'ai', text: data.reply || 'No response received.' },
          ]);
        } catch (error) {
          console.error('Failed to send message:', error);
          setMessages((prev) => [
            ...prev,
            { role: 'ai', text: '⚠️ Error: Could not reach DataLens.' },
          ]);
        } finally {
          setIsLoading(false);
        }
      };

      return (
        <div className="fixed bottom-6 right-6 z-40 flex flex-col items-end">
          {/* Chat Window */}
          {isOpen && (
            <div className="w-full sm:w-[450px] h-[650px] max-h-[85vh] mb-4 bg-gray-950/95 backdrop-blur-2xl rounded-3xl border border-white/10 shadow-[0_0_50px_rgba(79,70,229,0.15)] flex flex-col overflow-hidden animate-fade-in-up origin-bottom-right">
              {/* Header */}
              <div className="flex-none px-5 py-4 border-b border-white/5 bg-gray-900/50 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20">
                    <svg className="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>
                  </div>
                  <div>
                    <h2 className="text-sm font-bold text-gray-100">DataLens Tutor</h2>
                    <p className="text-[10px] text-indigo-300/70 font-semibold uppercase tracking-wider">AI Assistant</p>
                  </div>
                </div>
                <button onClick={() => setIsOpen(false)} className="text-gray-400 hover:text-white p-2 rounded-lg hover:bg-white/5 transition-colors">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
              </div>

              {/* Messages */}
              <div className="flex-1 overflow-y-auto chat-scroll px-4 py-5 bg-gradient-to-b from-transparent to-gray-900/20">
                <div className="space-y-4">
                  {messages.length === 0 && (
                    <div className="text-center mt-8 text-gray-400 text-sm">
                      <p className="mb-2 text-gray-300">Hello! I'm DataLens.</p>
                      <p>Ask me anything about your HR data.</p>
                    </div>
                  )}
                  {messages.map((msg, idx) => (
                    <ChatBubble key={idx} role={msg.role} text={msg.text} onMaximize={onMaximize} />
                  ))}
                  {isLoading && <TypingIndicator />}
                  <div ref={messagesEndRef} className="h-2" />
                </div>
              </div>

              {/* Input */}
              <form onSubmit={sendMessage} className="flex-none p-3 bg-gray-900/50 border-t border-white/5">
                <div className="relative flex items-center bg-gray-950/50 rounded-xl overflow-hidden border border-white/5 focus-within:border-indigo-500/30 transition-colors">
                  <input
                    ref={inputRef}
                    type="text"
                    value={input}
                    onChange={(e) => setInput(e.target.value)}
                    disabled={isLoading}
                    placeholder="Ask about HR data..."
                    className="w-full bg-transparent border-none py-3 pl-4 pr-12 text-sm text-gray-100 placeholder-gray-500 focus:outline-none"
                  />
                  <button
                    type="submit"
                    disabled={isLoading || !input.trim()}
                    className="absolute right-1.5 p-1.5 rounded-lg bg-indigo-500 hover:bg-indigo-400 text-white disabled:opacity-50 transition-colors"
                  >
                    <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2.5} d="M12 19V5m-7 7l7-7 7 7" /></svg>
                  </button>
                </div>
              </form>
            </div>
          )}

          {/* FAB Button */}
          <button
            onClick={() => setIsOpen(!isOpen)}
            className={`relative flex items-center justify-center w-14 h-14 rounded-full bg-gradient-to-tr from-indigo-600 to-purple-600 text-white shadow-xl shadow-indigo-600/30 hover:scale-105 active:scale-95 transition-all duration-300 z-50 ${isOpen ? 'rotate-90 scale-90 opacity-0 pointer-events-none absolute' : 'rotate-0 opacity-100'}`}
          >
            <div className="absolute -inset-1 bg-gradient-to-r from-indigo-500 to-purple-500 rounded-full blur-sm opacity-50 animate-glow"></div>
            <svg className="w-6 h-6 relative z-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" /></svg>
          </button>
        </div>
      );
    }

    /* ─── Main App (HR Dashboard) ───────────────────────── */
    function App() {
      const [modalContent, setModalContent] = useState(null);

      // Dummy HR Data Icons
      const icons = {
        users: <svg className="w-full h-full text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>,
        briefcase: <svg className="w-full h-full text-purple-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
        trending: <svg className="w-full h-full text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg>,
        cash: <svg className="w-full h-full text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
      };

      return (
        <div className="flex flex-col h-full text-gray-100 selection:bg-indigo-500/30 selection:text-white relative bg-gray-950">
          
          {/* Header */}
          <header className="flex-none px-6 md:px-10 py-5 border-b border-white/5 bg-gray-950/80 backdrop-blur-xl sticky top-0 z-20 shadow-xl">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-4">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg">
                  <svg className="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight">HR Analytics Dashboard</h1>
                  <p className="text-xs text-gray-400 font-medium mt-0.5">Global Organization Overview</p>
                </div>
              </div>
              <div className="hidden sm:flex items-center gap-3">
                <div className="text-right">
                  <p className="text-sm font-semibold text-gray-200">Jane Doe</p>
                  <p className="text-xs text-gray-500">CHRO</p>
                </div>
                <div className="w-10 h-10 rounded-full bg-indigo-900 border-2 border-indigo-500/30"></div>
              </div>
            </div>
          </header>

          {/* Main Dashboard Content */}
          <main className="flex-1 overflow-y-auto px-6 md:px-10 py-8">
            <div className="max-w-7xl mx-auto space-y-8 pb-24">
              
              {/* Stat Cards Grid */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                <StatCard title="Total Employees" value="1,248" icon={icons.users} trend="12% from last year" positive={true} />
                <StatCard title="Open Roles" value="42" icon={icons.briefcase} trend="5% from last month" positive={false} />
                <StatCard title="Attrition Rate" value="4.2%" icon={icons.trending} trend="0.8% from last quarter" positive={true} />
                <StatCard title="Avg. Salary" value="$84,500" icon={icons.cash} trend="2.4% adjustment applied" positive={true} />
              </div>

              {/* Charts Area */}
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="lg:col-span-2 glass rounded-2xl p-6 border border-white/5 shadow-xl h-[400px] flex flex-col items-center justify-center text-center">
                  <svg className="w-16 h-16 text-indigo-500/30 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                  <h3 className="text-lg font-bold text-gray-300">Headcount Over Time</h3>
                  <p className="text-sm text-gray-500 mt-2 max-w-sm">Open the DataLens AI Tutor in the bottom right corner to generate dynamic charts from your database!</p>
                </div>
                
                <div className="glass rounded-2xl p-6 border border-white/5 shadow-xl h-[400px] flex flex-col items-center justify-center text-center">
                  <svg className="w-16 h-16 text-purple-500/30 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1} d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" /></svg>
                  <h3 className="text-lg font-bold text-gray-300">Department Breakdown</h3>
                  <p className="text-sm text-gray-500 mt-2">Ask DataLens to visualize employee distribution.</p>
                </div>
              </div>
            </div>
          </main>

          {/* Floating Chat Widget */}
          <ChatWidget onMaximize={setModalContent} />

          {/* ─── Chart Modal ────────────────────────────── */}
          {modalContent && (
            <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm p-4 md:p-8 animate-fade-in-up" style={{ animationDuration: '0.2s' }} onClick={() => setModalContent(null)}>
              <div 
                className="bg-gray-900 border border-white/10 rounded-2xl p-6 md:p-8 shadow-2xl w-full max-w-6xl max-h-full overflow-auto relative flex flex-col"
                onClick={e => e.stopPropagation()}
              >
                <button 
                  className="absolute top-4 right-4 p-2 text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 rounded-xl transition-colors"
                  onClick={() => setModalContent(null)}
                  title="Close (Esc)"
                >
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                </button>
                <h3 className="text-xl font-bold mb-4 text-gray-100">Expanded View</h3>
                <div 
                  className="w-full flex-1 flex items-center justify-center [&>svg]:!w-full [&>svg]:!h-auto [&>svg]:!max-w-full [&>svg]:max-h-[75vh]" 
                  dangerouslySetInnerHTML={{ __html: modalContent }} 
                />
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
